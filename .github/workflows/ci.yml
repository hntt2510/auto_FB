name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        name: Typecheck
      - run: npx eslint .
        name: Lint
      - run: node scripts/test-with-abi.cjs
        name: Test
      - run: npm run build
        name: Build & Package
      - name: Verify Package Artifacts
        run: |
          node -e "const fs = require('fs'); if (!fs.existsSync('release/win-unpacked/Facebook Account Manager.exe')) throw new Error('release/win-unpacked/Facebook Account Manager.exe does not exist');"
      - name: Generate Release Manifest
        run: node scripts/release-manifest.mjs
